name: Bug report
description: Report a reproducible defect without including credentials or private repository data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste tokens, private keys, passphrases, private remote URLs, or unredacted diagnostic logs.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected and actual result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options: [Windows 10, Windows 11, Windows Server, Other]
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, private keys, tokens, and private repository details.
          required: true
